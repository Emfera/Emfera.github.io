<main>
  <h1>R1 · BDA-Maßnahmenpolygon <span class="sub" id="ver"></span></h1>
  <div class="sub">Grabungsgrenze in Gauß-Krüger → Shapefile nach BDA-Vorlage in Lambert (EPSG 31287). Alles läuft im Browser.</div>

  <section>
    <h2>1 · Grabungsgrenze</h2>
    <div class="row">
      <div><label for="src">Koordinatensystem der Messdaten</label>
        <select id="src"><option value="EPSG:31254">MGI / GK West M28 (31254)</option><option value="EPSG:31255" selected>MGI / GK Central M31 (31255)</option><option value="EPSG:31256">MGI / GK East M34 (31256)</option></select></div>

    </div>
    <label for="pts">Punkte: eine Zeile je Punkt <code>Fläche;Ost;Nord</code> (Hochwert verkürzt, wie GSI 81/82). Aus GSI werden ARDIG-Codes Typ 93 und 92 übernommen.</label>
    <textarea id="pts"></textarea>
    <canvas id="map"></canvas>
  </section>

  <section>
    <h2>2 · Angaben für die Attributtabelle</h2>
    <div class="row">
      <div><label for="Mnr">Maßnahmennummer (Mnr)</label><input id="Mnr" placeholder="19560.22.01"></div>
      <div><label for="Mnart">Maßnahmenart (Mnart)</label><select id="Mnart"></select></div>
      <div><label for="Gemeinde">Ortsgemeinde (Gemeinde)</label><input id="Gemeinde"></div>
      <div><label for="KGname">Katastralgemeinde (KGname)</label><input id="KGname"></div>
      <div><label for="SE">Anzahl der SE (SE)</label><input id="SE" type="number" min="0" step="1"></div>
      <div><label for="Erhaltung">Befunde erhalten? (Erhaltung)</label><select id="Erhaltung"><option value="">–</option><option value="J">J – ja</option><option value="N">N – nein, 100 % untersucht</option></select></div>
    </div>
    <label for="GstNrBEF">Grundstücke mit relevanten Bereichen (GstNrBEF), mit Semikolon</label><input id="GstNrBEF" placeholder="101; 102">
    <label>Fundart (Mehrfachauswahl)</label><div class="checks" id="Fundart"></div>
    <label>Datierung (Mehrfachauswahl)</label><div class="checks" id="Datierung"></div>
  </section>

  <section>
    <h2>3 · Erzeugen</h2>
    <button id="make">Maßnahmenpolygon erzeugen (ZIP)</button>
    <button id="demo" class="sec">Beispieldaten</button>
    <pre id="out"></pre>
  </section>
</main>
