      <div><label for="mnr">Maßnahmennummer zur Prüfung (optional)</label><input id="mnr" placeholder="72101.26.01"></div>
    </div>
    <label for="pts">Eine Zeile je Punkt: <code>Name;Ost;Nord</code>. Gleicher Name mit mindestens 3 Punkten = Fläche (z. B. Grabungsgrenze).</label>
    <textarea id="pts"></textarea>
    <button id="go">Abfragen</button><button id="demo" class="sec">Beispiel Klagenfurt</button>
  </section>
  <section id="res" hidden><h2>Ergebnis</h2><div id="out"></div></section>
  <div class="q" id="src-note"></div>
</main>
